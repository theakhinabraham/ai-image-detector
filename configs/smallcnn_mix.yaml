# Phase 4: fine-tune the CIFAKE-trained smallcnn on a MIX of CIFAKE and COCOAI.
# Mixing CIFAKE back in stops the model forgetting CIFAKE (catastrophic forgetting).
run_name: smallcnn_mix
seed: 42
data:
  root: data/raw/cifake        # contains train/{REAL,FAKE} and test/{REAL,FAKE}
  splits_file: data/splits.json
  cocoai_manifest: data/cocoai/manifest.csv   # ft_train / ft_val splits are used
  cifake_mix_train: 1600      # random CIFAKE train images (same count as COCOAI ft_train)
  cifake_mix_val: 400         # random CIFAKE val images (same count as COCOAI ft_val)
  val_fraction: 0.10           # 10% of the official train set held out for validation
  img_size: 32                 # native CIFAKE resolution
  # Normalise each channel to roughly [-1, 1]. Simple and model-agnostic.
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
  batch_size: 128
  num_workers: 4
model:
  name: smallcnn
  dropout: 0.3
train:
  init_checkpoint: checkpoints/smallcnn.pt
  device: cpu
  epochs: 10
  lr: 0.0001                    # small: adjust the trained model, do not overwrite it
  weight_decay: 0.0001         # small L2 penalty to discourage very large weights
  patience: 3
