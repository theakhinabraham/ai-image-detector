# Phase 4: fine-tune the CIFAKE-trained resnet18 on a MIX of CIFAKE and COCOAI.
# Mixing CIFAKE back in stops the model forgetting CIFAKE (catastrophic forgetting).
run_name: resnet18_mix
seed: 42
data:
  root: data/raw/cifake
  splits_file: data/splits.json
  cocoai_manifest: data/cocoai/manifest.csv   # ft_train / ft_val splits are used
  cifake_mix_train: 1600      # random CIFAKE train images (same count as COCOAI ft_train)
  cifake_mix_val: 400         # random CIFAKE val images (same count as COCOAI ft_val)
  val_fraction: 0.10
  img_size: 64                    # 32x32 upscaled; more spatial room for the deeper network
  # ImageNet statistics: the pretrained weights expect inputs normalised this way
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  batch_size: 128
  num_workers: 6
model:
  name: resnet18
train:
  init_checkpoint: checkpoints/resnet18.pt
  device: mps                     # Apple GPU (fast enough for this small fine-tune)
  epochs: 10
  lr: 0.0001                    # small: adjust the trained model, do not overwrite it
  weight_decay: 0.0001
  patience: 3
